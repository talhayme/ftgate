[project]
name = "ftgate"
version = "0.0.1"
description = "Regression checks for small fine-tuned models on tool calling: do runtimes send the bytes the model was trained on?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["transformers>=4.45", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ftgate = "ftgate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
