[project]
name = "ftgate"
version = "0.1.3"
description = "Regression checks for small fine-tuned models on tool calling: do runtimes send the bytes the model was trained on?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vitalii Bogachev" }]
keywords = ["fine-tuning", "tool-calling", "ollama", "llama.cpp", "gguf", "evaluation", "dataset", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# jinja2: transformers needs it to render chat templates and does not pull it in itself.
dependencies = ["transformers>=4.45", "jinja2>=3.1", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/talhayme/ftgate"
Repository = "https://github.com/talhayme/ftgate"
Issues = "https://github.com/talhayme/ftgate/issues"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ftgate = "ftgate.cli:main"

[project.entry-points.pytest11]
ftgate = "ftgate.pytest_plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ftgate = ["assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
