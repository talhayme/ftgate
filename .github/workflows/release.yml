# Publishes to PyPI on a version tag, with Trusted Publishing: no token is
# stored anywhere. PyPI trusts this repository's workflow identity instead.
#
# One-time setup on pypi.org (account → Publishing → "Add a new pending
# publisher"): owner talhayme, repository ftgate, workflow release.yml,
# environment pypi. The project name is claimed by the first publish.
name: release
on:
  push:
    # Full versions only. The moving major tag (v0.1 → latest 0.1.x) exists
    # for `uses: talhayme/pr-witness@v0.1` and must not cut a release.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    # Skipped (not failed) until the PyPI trusted publisher exists: set the
    # repository variable PYPI_TRUSTED_PUBLISHER=true once it is configured.
    if: ${{ vars.PYPI_TRUSTED_PUBLISHER == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write       # Trusted Publishing
      attestations: write   # PEP 740 attestations on the uploaded files
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
